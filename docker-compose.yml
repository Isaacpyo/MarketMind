# Runs the whole stack locally: MongoDB, the API (seeds itself and trains a model on first
# start) and the web app.  Usage:  docker compose up --build  ->  http://localhost:3000
name: marketmind

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: marketmind
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-0123456789abcdef}
      CORS_ORIGINS: http://localhost:3000
      # No cooldown locally so you (and the e2e tests) can retrain back to back.
      RETRAIN_COOLDOWN_SECONDS: ${RETRAIN_COOLDOWN_SECONDS:-0}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        # The browser calls the API directly, so this is the host-visible URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
